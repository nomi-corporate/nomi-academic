name: nomi-academic-local
services:
  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: nomi_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${NOMI_POSTGRES_ADMIN_PASSWORD:?Execute scripts/Start-LocalDatabase.ps1 primeiro}
      NOMI_ACADEMIC_MIGRATOR_PASSWORD: ${NOMI_ACADEMIC_MIGRATOR_PASSWORD:?Senha de migrations ausente}
      NOMI_ACADEMIC_APP_PASSWORD: ${NOMI_ACADEMIC_APP_PASSWORD:?Senha da aplicação ausente}
    ports:
      - "127.0.0.1:${NOMI_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/local/postgres/initialize.sh:/docker-entrypoint-initdb.d/10-nomi.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
volumes:
  postgres_data:
