# Optional overlay: base API configuration remains unchanged.
services:
  caddy:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    container_name: nomi-caddy
    restart: unless-stopped
    mem_limit: 128m
    environment:
      NOMI_DOMAIN: ${NOMI_DOMAIN:?Informe o dominio publico do ambiente}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    networks: [academic, assistant, notifications]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data: {}
  caddy_config: {}
